name: Deploy Yggdrasil Worker

on:
  push:
    branches:
      - main
    paths:
      - "packages/yggdrasil-worker/**"
      - "packages/yggdrasil-runtime/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-yggdrasil-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        working-directory: packages/yggdrasil-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}