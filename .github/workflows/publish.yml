name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      - run: npm run check-versions

      - name: Publish @theaiinc/yggdrasil
        run: npm publish -w packages/yggdrasil --access public

      - name: Publish @theaiinc/yggdrasil-ratatoskr
        run: npm publish -w packages/ratatoskr --access public

      - name: Publish @theaiinc/yggdrasil-runtime
        run: npm publish -w packages/yggdrasil-runtime --access public

      - name: Publish @theaiinc/yggdrasiladmin-panel
        working-directory: packages/yggdrasil-grafana-plugins
        run: |
          npm install
          npm run build
          npm publish --access public
