name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install
      - run: npm run check-versions

      - name: Get GitHub OIDC id_token
        id: oidc
        run: |
          JWT=$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).value")
          echo -n "$JWT" > /tmp/oidc-jwt.txt
          echo "Got JWT: ${#JWT} chars"

      - name: Publish @theaiinc/yggdrasil
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          echo "Exchanging OIDC token for @theaiinc/yggdrasil..."
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/exchange-result.json \
            -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasil" \
            -H "Authorization: Bearer $JWT")
          echo "Exchange HTTP code: $HTTP_CODE"
          cat /tmp/exchange-result.json
          echo ""
          TOKEN=$(node -p "try{JSON.parse(require('fs').readFileSync('/tmp/exchange-result.json','utf8')).token}catch(e){console.error('Parse fail:'+e.message);''}")
          echo "Token length: ${#TOKEN}"
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/yggdrasil && npm publish --access public

      - name: Publish @theaiinc/yggdrasil-ratatoskr
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/exchange-result.json \
            -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasil-ratatoskr" \
            -H "Authorization: Bearer $JWT")
          echo "Ratatoskr exchange HTTP: $HTTP_CODE"
          TOKEN=$(node -p "try{JSON.parse(require('fs').readFileSync('/tmp/exchange-result.json','utf8')).token}catch(e){''}")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/ratatoskr && npm publish --access public

      - name: Publish @theaiinc/yggdrasil-runtime
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/exchange-result.json \
            -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasil-runtime" \
            -H "Authorization: Bearer $JWT")
          echo "Runtime exchange HTTP: $HTTP_CODE"
          TOKEN=$(node -p "try{JSON.parse(require('fs').readFileSync('/tmp/exchange-result.json','utf8')).token}catch(e){''}")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/yggdrasil-runtime && npm publish --access public

      - name: Publish @theaiinc/yggdrasiladmin-panel
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/exchange-result.json \
            -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasiladmin-panel" \
            -H "Authorization: Bearer $JWT")
          echo "Admin-panel exchange HTTP: $HTTP_CODE"
          TOKEN=$(node -p "try{JSON.parse(require('fs').readFileSync('/tmp/exchange-result.json','utf8')).token}catch(e){''}")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
