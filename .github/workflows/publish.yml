name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install
      - run: npm run check-versions

      - name: Publish all packages
        run: |
          # Manually exchange the GitHub Actions OIDC token for an npm publish token
          echo "Fetching OIDC token for npm..."
          OIDC_TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).value))")
          
          export NPM_ID_TOKEN="$OIDC_TOKEN"

          npm publish -w packages/yggdrasil --access public
          npm publish -w packages/ratatoskr --access public
          npm publish -w packages/yggdrasil-runtime --access public

          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
