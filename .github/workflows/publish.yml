name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install
      - run: npm run check-versions

      - name: Publish all packages
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_CONFIG_USERCONFIG

          # Manually exchange OIDC token for an npm publish token via the npm API
          echo "=== Exchanging OIDC token for npm registry token ==="

          OIDC_TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).value")

          echo "OIDC token obtained: ${#OIDC_TOKEN} chars"

          # Exchange OIDC token for npm registry token
          NPM_RESP=$(curl -sS -X POST \
            "https://registry.npmjs.org/-/npm/v1/token" \
            -H "content-type: application/json" \
            -H "npm-auth-type: oidc" \
            -d "{\"oidc_id_token\":\"$OIDC_TOKEN\",\"token_type\":\"publish\"}")
          
          echo "Exchange response length: ${#NPM_RESP}"
          echo "Exchange response: $(echo $NPM_RESP | head -c 200)"

          NPM_TOKEN=$(echo "$NPM_RESP" | node -p "try{const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));d.token}catch(e){console.error('Parse error:'+e.message);process.exit(1)}")

          echo "npm token obtained: ${#NPM_TOKEN} chars"
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc

          # Publish
          npm publish -w packages/yggdrasil --access public
          echo "=== published yggdrasil ==="
          npm publish -w packages/ratatoskr --access public
          echo "=== published ratatoskr ==="
          npm publish -w packages/yggdrasil-runtime --access public
          echo "=== published runtime ==="

          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
          echo "=== published admin-panel ==="
