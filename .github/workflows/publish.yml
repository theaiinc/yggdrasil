name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install
      - run: npm run check-versions

      - name: Publish all packages
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          # setup-node sets NODE_AUTH_TOKEN=GITHUB_TOKEN which overrides OIDC
          # Delete it from npm config so OIDC kicks in
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true

          npm publish -w packages/yggdrasil --access public
          npm publish -w packages/ratatoskr --access public
          npm publish -w packages/yggdrasil-runtime --access public

          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
