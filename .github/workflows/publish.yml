name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npm run check-versions

      - name: Publish all packages
        run: |
          # Remove setup-node's .npmrc — it has an empty _authToken that blocks OIDC
          rm -f "$NPM_CONFIG_USERCONFIG"
          unset NPM_CONFIG_USERCONFIG

          npm publish -w packages/yggdrasil --access public
          npm publish -w packages/ratatoskr --access public
          npm publish -w packages/yggdrasil-runtime --access public

          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
