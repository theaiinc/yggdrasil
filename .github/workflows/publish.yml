name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Intentionally omitting registry-url to avoid setup-node injecting
          # GITHUB_TOKEN as NODE_AUTH_TOKEN into .npmrc — that blocks OIDC.
          # npm CLI auto-detects OIDC when ACTIONS_ID_TOKEN_REQUEST_URL is set.

      - run: npm install
      - run: npm run check-versions

      - name: Publish all packages
        run: |
          npm publish -w packages/yggdrasil --access public
          npm publish -w packages/ratatoskr --access public
          npm publish -w packages/yggdrasil-runtime --access public

          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
