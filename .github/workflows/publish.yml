name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install
      - run: npm run check-versions

      - name: Publish all packages
        run: |
          # Get GitHub OIDC id_token (audience = npm)
          JWT=$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).value")

          # Exchange for a short-lived npm publish token
          # The token works for ANY package the OIDC trusted publisher is
          # configured for, so we only need one exchange.
          TOKEN=$(curl -sS -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasil" \
            -H "Authorization: Bearer $JWT" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).token")

          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc

          cd packages/yggdrasil && npm publish --access public
          cd "$OLDPWD"

          cd packages/ratatoskr && npm publish --access public
          cd "$OLDPWD"

          cd packages/yggdrasil-runtime && npm publish --access public
          cd "$OLDPWD"

          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
