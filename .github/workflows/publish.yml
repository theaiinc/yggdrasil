name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install
      - run: npm run check-versions

      - name: Publish all packages
        shell: bash
        run: |
          # Unblock any NODE_AUTH_TOKEN from setup-node — it blocks OIDC
          unset NODE_AUTH_TOKEN

          # Fetch OIDC token from GitHub Actions
          echo "=== Fetching OIDC token ==="
          OIDC_RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          RC=$?
          echo "curl exit code: $RC"
          echo "response length: ${#OIDC_RESP}"

          if [ $RC -ne 0 ] || [ -z "$OIDC_RESP" ]; then
            echo "ERROR: Failed to get OIDC token"
            exit 1
          fi

          OIDC_TOKEN=$(echo "$OIDC_RESP" | node -e "
            process.stdin.resume();
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try{const v=JSON.parse(d).value; console.log(v); }
              catch(e){ console.error('JSON parse error: '+e.message); process.exit(1); }
            });
          ")
          echo "Token obtained: ${#OIDC_TOKEN} chars"

          export NPM_ID_TOKEN="$OIDC_TOKEN"

          # Publish
          npm publish -w packages/yggdrasil --access public
          echo "=== published yggdrasil ==="
          npm publish -w packages/ratatoskr --access public
          echo "=== published ratatoskr ==="
          npm publish -w packages/yggdrasil-runtime --access public
          echo "=== published runtime ==="

          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
          echo "=== published admin-panel ==="
