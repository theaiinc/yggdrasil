name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install
      - run: npm run check-versions

      # Exchange the GitHub Actions OIDC id_token for a short-lived npm token.
      #
      # npm CLI 11.x *should* do this automatically, but in practice the
      # env vars that setup-node injects (NODE_AUTH_TOKEN, NPM_CONFIG_USERCONFIG)
      # interfere.  We do the exchange ourselves so we're in full control.
      #
      # Endpoint:  POST /-/npm/v1/oidc/token/exchange/package/{escaped-name}
      # Auth:      Bearer <GitHub OIDC id_token>  (audience = npm:registry.npmjs.org)
      # Response:  {"token": "npm_<short-lived-token>"}
      - name: Get npm publish token via OIDC exchange
        id: oidc
        run: |
          # 1. Get the GitHub OIDC id_token for npm audience
          JWT=$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).value")
          echo "JWT length: ${#JWT}"

          # 2. Exchange it with npm for a short-lived publish token.
          #    The endpoint is per-package, so we do this once per package.
          #    Store the JWT in a file so subsequent steps can re-use it.
          echo -n "$JWT" > /tmp/oidc-jwt.txt

      - name: Publish @theaiinc/yggdrasil
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          TOKEN=$(curl -sS -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasil" \
            -H "Authorization: Bearer $JWT" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).token")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/yggdrasil && npm publish --access public

      - name: Publish @theaiinc/yggdrasil-ratatoskr
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          TOKEN=$(curl -sS -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasil-ratatoskr" \
            -H "Authorization: Bearer $JWT" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).token")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/ratatoskr && npm publish --access public

      - name: Publish @theaiinc/yggdrasil-runtime
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          TOKEN=$(curl -sS -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasil-runtime" \
            -H "Authorization: Bearer $JWT" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).token")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/yggdrasil-runtime && npm publish --access public

      - name: Publish @theaiinc/yggdrasiladmin-panel
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          TOKEN=$(curl -sS -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasiladmin-panel" \
            -H "Authorization: Bearer $JWT" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).token")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
