name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install
      - run: npm run check-versions

      - name: Publish @theaiinc/yggdrasil
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm publish -w packages/yggdrasil --access public

      - name: Publish @theaiinc/yggdrasil-ratatoskr
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm publish -w packages/ratatoskr --access public

      - name: Publish @theaiinc/yggdrasil-runtime
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm publish -w packages/yggdrasil-runtime --access public

      - name: Publish @theaiinc/yggdrasiladmin-panel
        working-directory: packages/yggdrasil-grafana-plugins
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm install
          npm run build
          npm publish --access public
