name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install
      - run: npm run check-versions

      - name: Publish all packages
        run: |
          # setup-node creates a temp .npmrc with _authToken=GITHUB_TOKEN
          # This overrides OIDC. Remove it so npm falls back to OIDC.
          echo "=== before cleanup ==="
          echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG"
          if [ -n "$NPM_CONFIG_USERCONFIG" ]; then
            echo "--- contents ---"
            cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(cannot read)"
            rm -f "$NPM_CONFIG_USERCONFIG"
          fi
          unset NPM_CONFIG_USERCONFIG
          echo "=== after cleanup ==="
          npm config list

          npm publish -w packages/yggdrasil --access public
          npm publish -w packages/ratatoskr --access public
          npm publish -w packages/yggdrasil-runtime --access public

          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
