name: Publish to npm & Docker

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install
      - run: npm run check-versions

      - name: Get GitHub OIDC id_token
        id: jwt
        run: |
          JWT=$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).value")
          echo -n "$JWT" > /tmp/oidc-jwt.txt

      # Each package needs its own OIDC token exchange (tokens are package-scoped)
      - name: Publish @theaiinc/yggdrasil
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          TOKEN=$(curl -sS -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasil" \
            -H "Authorization: Bearer $JWT" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).token")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/yggdrasil && npm publish --access public

      - name: Publish @theaiinc/yggdrasil-ratatoskr
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          TOKEN=$(curl -sS -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasil-ratatoskr" \
            -H "Authorization: Bearer $JWT" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).token")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/ratatoskr && npm publish --access public

      - name: Publish @theaiinc/yggdrasil-runtime
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          TOKEN=$(curl -sS -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasil-runtime" \
            -H "Authorization: Bearer $JWT" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).token")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/yggdrasil-runtime && npm publish --access public

      - name: Publish @theaiinc/yggdrasiladmin-panel
        run: |
          JWT=$(cat /tmp/oidc-jwt.txt)
          TOKEN=$(curl -sS -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@theaiinc%2fyggdrasiladmin-panel" \
            -H "Authorization: Bearer $JWT" \
            | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).token")
          echo "//registry.npmjs.org/:_authToken=$TOKEN" > ~/.npmrc
          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public

      # ── Docker images ────────────────────────────────────────────────

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Yggdrasil
        uses: docker/build-push-action@v6
        with:
          context: packages/yggdrasil
          push: true
          tags: |
            ghcr.io/theaiinc/yggdrasil:${{ github.event.release.tag_name }}
            ghcr.io/theaiinc/yggdrasil:latest
            theaiinc/yggdrasil:${{ github.event.release.tag_name }}
            theaiinc/yggdrasil:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      - name: Build and push Ratatoskr
        uses: docker/build-push-action@v6
        with:
          context: packages/ratatoskr
          push: true
          tags: |
            ghcr.io/theaiinc/ratatoskr:${{ github.event.release.tag_name }}
            ghcr.io/theaiinc/ratatoskr:latest
            theaiinc/ratatoskr:${{ github.event.release.tag_name }}
            theaiinc/ratatoskr:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
