name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: npm install
      - run: npm run check-versions

      # Single step — OIDC is auto-detected once and re-used across all
      # publishes. Separating into per-package steps means fresh npm processes
      # are blocked by setup-node's temp .npmrc (empty _authToken).
      - name: Publish all packages
        run: |
          npm publish -w packages/yggdrasil --access public
          npm publish -w packages/ratatoskr --access public
          npm publish -w packages/yggdrasil-runtime --access public

          cd packages/yggdrasil-grafana-plugins
          npm install
          npm run build
          npm publish --access public
