global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Orchestration Controller
  - job_name: 'orchestration-controller'
    static_configs:
      - targets: ['orchestration-controller:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Ratatoskr runners (discovered through orchestration controller)
  - job_name: 'runners'
    static_configs:
      - targets: ['orchestration-controller:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
