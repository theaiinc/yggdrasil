events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstream for agent pool
    upstream agent_pool {
        # Dynamic upstream with health checks
        server agent-1:8080 max_fails=3 fail_timeout=30s;
        server agent-2:8080 max_fails=3 fail_timeout=30s;
        server agent-3:8080 max_fails=3 fail_timeout=30s;
        
        # Session affinity
        sticky cookie srv_id expires=1h domain=.yggdrasil.local;
        
        # Keep connections alive
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=health:10m rate=30r/s;

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            limit_req zone=health burst=5 nodelay;
            
            # Return health status
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Metrics endpoint for Prometheus
        location /metrics {
            access_log off;
            limit_req zone=health burst=5 nodelay;
            
            # Proxy to orchestration controller
            proxy_pass http://orchestration-controller:3000/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Main API endpoints
        location / {
            limit_req zone=api burst=20 nodelay;
            
            # Proxy to agent pool
            proxy_pass http://agent_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Error handling
            proxy_intercept_errors on;
            error_page 502 503 504 /error.html;
        }

        # Agent-specific endpoints
        location ~ ^/agent/([^/]+)/(.*)$ {
            limit_req zone=api burst=20 nodelay;
            
            # Extract agent ID and path
            set $agent_id $1;
            set $agent_path $2;
            
            # Route to specific agent
            proxy_pass http://agent-$agent_id:8080/$agent_path;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Error page
        location /error.html {
            internal;
            return 503 "Service temporarily unavailable\n";
            add_header Content-Type text/plain;
        }

        # Status page
        location /status {
            access_log off;
            stub_status on;
        }
    }
} 