global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Orchestration Controller
  - job_name: 'orchestration-controller'
    static_configs:
      - targets: ['orchestration-controller:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Agent instances
  - job_name: 'agents'
    static_configs:
      - targets:
          - 'agent-1:8080'
          - 'agent-2:8080'
          - 'agent-3:8080'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Nginx load balancer
  - job_name: 'nginx'
    static_configs:
      - targets: ['load-balancer:80']
    metrics_path: '/status'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis (if used)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Node.js applications
  - job_name: 'nodejs'
    static_configs:
      - targets:
          - 'orchestration-controller:3000'
          - 'agent-1:8080'
          - 'agent-2:8080'
          - 'agent-3:8080'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
